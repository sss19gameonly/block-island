function addB(t,fn){let b=document.createElement('button');b.className='btn';b.textContent=t;b.onclick=fn;eb.appendChild(b)}function renderEvent(){eventBox.classList.toggle('on',!!g.event);eb.innerHTML='';if(!g.event)return;let br=g.event.br;if(br==='population'){et.textContent='👥 開拓隊が出発！';ex.textContent='隣接する海を1マス選んで開拓。';g.event.mode='expand'}if(br==='industry'){et.textContent='⚙️ 職人の技！';ex.textContent='手札1枚を別系統のLv1へ加工。';g.hand.forEach((id,i)=>addB(`${O[id].icon}${O[id].name}`,()=>{g.event.card=i;eb.innerHTML='';let cur=O[id].branch;K.filter(k=>k!==cur).forEach(k=>addB(`${M[k][0]}${M[k][1]}Lv1`,()=>{g.hand[i]=C[k][0][0];status('⚙️ カードを加工した！');endEvent()}))}))}if(br==='nature'){et.textContent='🌿 森の精霊！';ex.textContent='盤面上のLv1施設ひとつをランダムでLv2へ成長。';addB('精霊の力を受ける',()=>{let a=g.cells.map((c,i)=>c.object&&O[c.object].level===0?i:null).filter(x=>x!==null);if(a.length){let i=a[Math.floor(Math.random()*a.length)],o=obj(i);g.cells[i].object=C[o.branch][1][0];recompute();status(`🌿 ${o.name} → ${C[o.branch][1][1]}！`)}endEvent()})}if(br==='culture'){et.textContent='🗿 超古代技術が起動！';ex.textContent='通常施設1つを空き陸地へ移動。使わない選択も可能。';addB('施設を移動する',()=>{g.event.mode='from';renderP()});addB('移動しない',endEvent)}}
function boardEvent(i){if(!g.event)return 0;if(g.event.br==='population'&&g.event.mode==='expand'){if(g.cells[i].terrain==='water'&&nb(i).some(j=>g.cells[j].terrain==='land')){g.cells[i].terrain='land';g.cands=pick();status('👥 新しい土地を開拓！');endEvent()}return 1}if(g.event.br==='culture'){if(g.event.mode==='from'){if(g.cells[i].object&&!g.cells[i].fg){g.event.from=i;g.event.mode='to';status('移動先の空き陸地を選択。');renderP()}return 1}if(g.event.mode==='to'){if(g.cells[i].terrain==='land'&&!g.cells[i].object){g.cells[i].object=g.cells[g.event.from].object;g.cells[g.event.from].object=null;recompute();status('🗿 施設を移動した！');endEvent()}return 1}}return 0}
function renderP(){K.forEach((k,i)=>document.getElementById('p'+i).textContent=g.stats[k]);turn.textContent=g.turn;mode.textContent=g.final?'FINAL DEVELOPMENT':'Standard';forecast.textContent=g.final?'土地成長なし。合体と連鎖を仕上げよう。':`◇ 次の陸地候補 ${g.cands.length}マス${meta.rewards.s2?'（開拓予測強化）':''}`;hand.innerHTML='';g.hand.forEach((id,i)=>{let o=O[id],b=document.createElement('button');b.className='card'+(g.sel===i?' sel':'');b.disabled=g.final||g.finished||!!g.event;b.innerHTML=`<span class=i>${o.icon}</span><span class=n>${o.name}</span>`;b.onclick=()=>{g.sel=i;renderP()};hand.appendChild(b)});board.innerHTML='';for(let i=0;i<36;i++){let c=g.cells[i],b=document.createElement('button'),cl='cell'+(c.terrain==='land'?' land':'')+(g.sel!==null&&c.terrain==='land'&&!c.object?' valid':'')+(g.cands.includes(i)&&!g.final?' fore':'')+(merges(i).length?' merge':'');if(g.event&&g.event.br==='population'&&g.event.mode==='expand'&&c.terrain==='water'&&nb(i).some(j=>g.cells[j].terrain==='land'))cl+=' target';if(g.event&&g.event.br==='culture'&&g.event.mode==='to'&&c.terrain==='land'&&!c.object)cl+=' target';b.className=cl;if(g.cands.includes(i)&&!g.final)b.innerHTML='<span class=diamond>◇</span>';if(c.object)b.innerHTML+=`${O[c.object].icon}<span class=badge>Lv${O[c.object].level+1}</span>`;b.onclick=()=>{if(!boardEvent(i))place(i)};board.appendChild(b)}cancel.hidden=!g.merge;focus.hidden=!meta.rewards.s4||g.focusUsed||g.final||g.finished;finish.hidden=!g.final||g.finished;renderEvent()}
focus.onclick=()=>{if(g.focusUsed)return;eventBox.classList.add('on');et.textContent='🎯 集中探索';ex.textContent='手札3枚を選んだ系統のLv1に統一。1探索1回。';eb.innerHTML='';K.forEach(k=>addB(`${M[k][0]}${M[k][1]}`,()=>{g.hand=[C[k][0][0],C[k][0][0],C[k][0][0]];g.focusUsed=true;eventBox.classList.remove('on');renderP()}))};cancel.onclick=()=>{g.merge=null;renderP()};
function finals(k){return new Set(g.cells.filter(c=>c.fg&&O[c.object].branch===k).map(c=>c.fg)).size}finish.onclick=()=>{g.finished=true;recompute();g.reward={};K.forEach((k,i)=>{g.reward[k]=Math.ceil(g.stats[k]*.1)+finals(k)*3;document.getElementById('r'+i).textContent=g.reward[k]});let top=[...K].sort((a,b)=>g.stats[b]-g.stats[a])[0];rtype.textContent=`${M[top][0]} ${M[top][1]}が際立つ島`;result.classList.add('on');renderP()};home.onclick=()=>{if(g.claimed)return;K.forEach(k=>meta.resources[k]+=g.reward[k]);g.claimed=true;save();show('m');renderM()};restart.onclick=newGame;newrun.onclick=()=>{newGame();show('p')};
function cost(f){return f[5]&&ct(f[0])>0?f[5]:f[4]}function afford(c){return Object.entries(c).every(([k,v])=>meta.resources[k]>=v)}function fmt(c){return Object.entries(c).map(([k,v])=>`${M[k][0]}${v}`).join(' ')}function build(f){let c=cost(f);if(!f[6]()||ct(f[0])>=f[3]||!afford(c))return;for(const[k,v]of Object.entries(c)){meta.resources[k]-=v;meta.stats[k]+=v}meta.built[f[0]]=ct(f[0])+1;stageRewards();save();renderM()}
function renderM(){stageRewards();K.forEach((k,i)=>{document.getElementById('mr'+i).textContent=meta.resources[k];document.getElementById('ms'+i).textContent=meta.stats[k]});tiers.innerHTML='';[[meta.rewards.s2,'第2段階完成','開拓予測強化：候補3→2'],[meta.rewards.s3,'第3段階完成','ロマン施設「始まりの大樹」解放（詳細未確定）'],[meta.rewards.s4,'第4段階完成','集中探索を解放']].forEach(x=>{let d=document.createElement('div');d.className='unlock'+(x[0]?' on':'');d.innerHTML=`${x[0]?'✅':'🔒'} <b>${x[1]}</b><br>${x[2]}`;tiers.appendChild(d)});decor.innerHTML='';DEC.forEach(([k,v,n])=>{let on=meta.stats[k]>=v,d=document.createElement('div');d.className='unlock'+(on?' on':'');d.textContent=`${on?'✅':'🔒'} ${M[k][0]}${v} ${n}`;decor.appendChild(d)});facilities.innerHTML='';F.forEach(f=>{let n=ct(f[0]),un=f[6](),c=cost(f),d=document.createElement('div');d.className='fac'+(!un?' locked':'');d.innerHTML=`<div class=small>Stage ${f[1]}</div><h3>${f[2]}${f[3]>1?` ${n}/${f[3]}`:''}</h3><div class=meta>${un?'建設可能':`条件：${f[7]}`}</div><div class=cost>${n>=f[3]?'完成':fmt(c)}</div>`;let b=document.createElement('button');b.textContent=n>=f[3]?'完成済み':'建設';b.disabled=n>=f[3]||!un||!afford(c);b.onclick=()=>build(f);d.appendChild(b);facilities.appendChild(d)});renderPort()}
function renderPort(){let open=done(S4),h=`<div class=small>${open?'✅ 港建設プロジェクト開始':'🔒 Stage4の4施設完成で解放'}</div>`;if(open)K.forEach(k=>{let v=meta.port[k];h+=`<div class=portrow><div>${M[k][0]} ${M[k][1]} ${v}/40<div class=bar><div class=fill style='width:${v*2.5}%'></div></div></div><div><button data-k=${k} data-n=1>+1</button> <button data-k=${k} data-n=5>+5</button> <button data-k=${k} data-n=99>MAX</button></div></div>`});if(open)h+=`<div class=small>${meta.portComplete?'⚓ 港完成！ 次の島へ進める状態。':'4資源すべて40で完成'}</div>`;port.innerHTML=h;port.querySelectorAll('button').forEach(b=>b.onclick=()=>{let k=b.dataset.k,need=40-meta.port[k],n=+b.dataset.n,a=Math.min(need,meta.resources[k],n===99?999:n);if(a>0){meta.resources[k]-=a;meta.port[k]+=a;meta.stats[k]+=a;meta.portComplete=K.every(x=>meta.port[x]>=40);save();renderM()}})}
function show(v){puzzle.classList.toggle('on',v==='p');mother.classList.toggle('on',v==='m');tp.classList.toggle('on',v==='p');tm.classList.toggle('on',v==='m')}tp.onclick=()=>show('p');tm.onclick=()=>{show('m');renderM()};grant.onclick=()=>{K.forEach(k=>meta.resources[k]+=100);save();renderM()};wipe.onclick=()=>{meta=D();save();renderM()};newGame();renderM();
</script></main></body></html>
