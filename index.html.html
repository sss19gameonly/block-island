<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ブロックアイランド</title><style>body{font-family:system-ui,sans-serif;background:#eaf6ff;color:#264653;text-align:center;margin:0;padding:16px}h1{margin:10px}#board{display:grid;grid-template-columns:repeat(5,min(16vw,65px));gap:5px;justify-content:center;margin:18px auto}.cell{aspect-ratio:1;border:2px solid #c9d6bc;border-radius:9px;background:#d9c5a3;font-size:30px;touch-action:manipulation}button{cursor:pointer}#tools{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.tool{font-size:17px;padding:10px;border:2px solid #aac;border-radius:12px;background:white}.selected{border-color:#ed8b30;background:#fff0d4}#status{min-height:3em}#reset{padding:9px 20px;border:0;border-radius:9px;background:#437b77;color:white}</style></head><body><h1>🏝️ ブロックアイランド</h1><p>草原を置いて島を広げよう！<br>森は草原の隣、家は森の隣に置けるよ。</p><p><b>スコア：<span id="score">0</span></b>　残り：<span id="left">15</span>手</p><div id="tools"><button class="tool selected" data-type="grass">🌱 草原 +1</button><button class="tool" data-type="forest">🌳 森 +3</button><button class="tool" data-type="house">🏠 家 +5</button></div><div id="board" aria-label="ゲーム盤"></div><p id="status" aria-live="polite">中央の島からスタート！</p><button id="reset">最初から</button><script>const N=5,icons={empty:'',grass:'🌱',forest:'🌳',house:'🏠'},points={grass:1,forest:3,house:5};let cells,selected,score,left;const board=document.getElementById('board'),status=document.getElementById('status');function neighbors(i){let x=i%N,y=Math.floor(i/N);return [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].filter(([a,b])=>a>=0&&a<N&&b>=0&&b<N).map(([a,b])=>b*N+a)}function render(){board.innerHTML='';cells.forEach((v,i)=>{let b=document.createElement('button');b.className='cell';b.textContent=icons[v];b.setAttribute('aria-label',`${i+1}番 ${v==='empty'?'海':v}`);b.style.background=v==='empty'?'#9cdded':'#c7e8a4';b.onclick=()=>place(i);board.appendChild(b)});document.getElementById('score').textContent=score;document.getElementById('left').textContent=left;document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('selected',b.dataset.type===selected))}function place(i){if(left<=0){status.textContent='終了！「最初から」で再挑戦してね。';return}if(cells[i]!=='empty'){status.textContent='ここにはもう置いてあるよ。';return}let need={grass:['grass','forest','house'],forest:['grass'],house:['forest']}[selected];if(!neighbors(i).some(j=>need.includes(cells[j]))){status.textContent=selected==='forest'?'森は草原の隣に置こう！':selected==='house'?'家は森の隣に置こう！':'今ある島の隣に置こう！';return}cells[i]=selected;score+=points[selected];left--;status.textContent=left?`いいね！ +${points[selected]}点`:`完成！ ${score}点！ また遊んでね。`;render()}function reset(){cells=Array(N*N).fill('empty');cells[12]='grass';selected='grass';score=0;left=15;status.textContent='中央の島からスタート！';render()}document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{selected=b.dataset.type;render()});document.getElementById('reset').onclick=reset;reset();</script></body></html>
